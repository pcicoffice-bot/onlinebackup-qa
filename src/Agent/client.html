<!doctype html>
<html lang="en" dir="ltr" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup</title>
<link rel="stylesheet" href="/i18n/theme.css">
<style>
.qrbox { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 8px 0 12px; } img.qr { background: #fff; border: 1px solid var(--line); border-radius: 8px; }

h1, h2, h3, p, label, li, td, th, .muted { overflow-wrap: break-word; }
/* colours, fonts, the top bar and the AI signature: /i18n/theme.css (DESIGN-040) */
* { box-sizing: border-box; }
body { font-size: 15px; line-height: 1.55; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 22px; }
header img { height: 36px; background: #fff; border-radius: 8px; padding: 3px; }

/* alternative C: a light side menu, the page, a bar fixed at the bottom of the restore steps (UX-1) */
body { margin: 0; background: #F4F6F9; }
.frame { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }

#nav button { display: flex; gap: 12px; align-items: center; border: none; background: none; padding: 10px 12px; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 600; color: var(--text); text-align: start; }
#nav button:hover { background: #F4F6F9; } #nav button.on { background: #E8F0FB; color: #1F5FBF; }
#nav .g { width: 20px; text-align: center; } .navfoot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.navfoot .pc { background: #F4F6F9; border-radius: 10px; padding: 10px 12px; } .navfoot .pc b, .navfoot .pc small { display: block; }
.page { min-width: 0; display: flex; flex-direction: column; }
main { margin: 24px 28px 96px; flex: 1; }
.rbar { position: sticky; bottom: 0; display: flex; gap: 12px; align-items: center; justify-content: space-between; background: #fff; border-top: 1px solid var(--line); padding: 14px 28px; }
.rbar > span { flex: 1; text-align: center; }
.hero { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; color: var(--text); box-shadow: none; display: block; }
.hero.warn { border-color: #E9B262; } .hero.bad { border-color: #E59A92; } .hero.info { border-color: #BFD3F2; }
.hero .top { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; } .hero h2 { margin: 2px 0; font-size: 24px; } .hero p { margin: 0; }
.hero .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.badge { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; flex: none; }
.badge.ok { background: #E7F4EC; color: #11764A; } .badge.warn { background: #FFF3DD; color: #8A4B00; } .badge.bad { background: #FDECEA; color: #B42318; } .badge.info { background: #E8F0FB; color: #1F5FBF; } .badge.muted { background: #EEF0F3; color: #5B6472; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; border-top: 1px solid var(--line); margin-top: 18px; padding-top: 14px; }
.facts small, .facts b { display: block; } .facts b { font-size: 19px; }
.chip { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.chip.ok { background: #E7F4EC; color: #11764A; } .chip.warn { background: #FFF3DD; color: #8A4B00; } .chip.bad { background: #FDECEA; color: #B42318; } .chip.info { background: #E8F0FB; color: #1F5FBF; } .chip.muted { background: #EEF0F3; color: #5B6472; }
.ok { color: #11764A; } .warn { color: #8A4B00; } .bad { color: #B42318; } .info { color: #1F5FBF; }
.problem { border: 1px solid #E9B262; background: #FFF8EC; border-radius: 14px; padding: 16px 20px; margin-bottom: 16px; } .problem.bad { border-color: #E59A92; background: #FDF3F2; }
.phead { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.pbody { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; margin-top: 8px; } @media (max-width: 900px) { .pbody { grid-template-columns: minmax(0, 1fr); } }
.path { display: flex; flex-direction: column; margin: 4px 0; } .path span { font-family: Consolas, monospace; font-size: 13px; }
.todo { background: #E8F0FB; border: 1px solid #BFD3F2; border-radius: 10px; padding: 10px 12px; align-self: start; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; } @media (max-width: 980px) { .two { grid-template-columns: minmax(0, 1fr); } }
.box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; margin-bottom: 16px; }
.bhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
button.link { border: none; background: none; color: #1F5FBF; font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
.srow2 { display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding: 10px 4px; cursor: pointer; } .srow2 small { display: block; } .srow2 .end { text-align: end; } .warnbg { background: #FFF8EC; }
.arow { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; } .arow small { display: block; }
.strip { display: flex; gap: 3px; margin: 8px 0; } .strip i { width: 9px; height: 16px; border-radius: 2px; background: #5B6472; } .strip i.ok { background: #11764A; } .strip i.warn { background: #D88A10; } .strip i.bad { background: #B42318; } .strip i.info { background: #1F5FBF; }
.card { background: #fff; } .card.st-muted { border-inline-start-color: #9AA3AF; } .card.st-info { border-inline-start-color: #1F5FBF; } .newset { border-style: dashed; }
.rhead { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.steps { display: flex; gap: 8px; list-style: none; padding: 0; margin: 0; } .steps li { padding: 4px 10px; border-radius: 999px; color: var(--muted); } .steps li.on { background: #E8F0FB; color: #1F5FBF; font-weight: 700; } .steps li.done { color: #11764A; }
.days { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; } .day { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; font: inherit; font-weight: 600; min-width: 76px; } .day.on { background: #1F5FBF; color: #fff; border-color: #1F5FBF; }
.keeps { background: #FFF3DD; border: 1px solid #F1C27D; border-radius: 10px; padding: 10px 12px; margin: 12px 0; }
.pill { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; } .pill.on { background: #1B2430; color: #fff; }
table.hist { background: #fff; border: 1px solid var(--line); border-radius: 12px; } tr.day td { background: #F8F9FB; font-weight: 700; color: var(--muted); } tr.hrow { cursor: pointer; } tr.hrow.open, tr.detail td { background: #FBFAF6; }
button.primary { background: #1F5FBF; color: #fff; border: none; border-radius: 9px; }
@media (max-width: 1100px) { .frame { grid-template-columns: 64px minmax(0, 1fr); } #nav .l, aside header .p, .navfoot .pc { display: none; } #nav button { justify-content: center; } }
.card { border: 1px solid var(--line); border-inline-start: 4px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #fff; }
.card.st-ok { border-inline-start-color: var(--ok); } .card.st-warn { border-inline-start-color: var(--warn); } .card.st-bad { border-inline-start-color: var(--bad); }
.card .n { font-weight: 700; font-size: 16px; }
.card .s { color: var(--muted); font-size: 13px; }
.grow { flex: 1; min-width: 200px; }
button.primary { padding: 9px 18px; font: inherit; font-weight: 650; cursor: pointer; }
button.sec { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; color: var(--text); }
button.sec:hover { border-color: #CBD5E1; }
button:disabled { opacity: .5; cursor: default; }
.ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; } .warn { color: var(--warn); font-weight: 600; } .muted { color: var(--muted); }
label { display: block; margin: 12px 0 5px; font-weight: 600; font-size: 14px; }
input, select, textarea { font: inherit; padding: 8px 11px; border: 1px solid #CBD5E1; border-radius: 9px; width: 100%; max-width: 540px; background: #fff; color: var(--text); }
input[type=checkbox] { accent-color: var(--brand); }
textarea { min-height: 90px; }
.ltr { direction: ltr; unicode-bidi: isolate; text-align: left; }   /* ltr-ok: Latin addresses and paths */
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: start; }
th { background: #F8FAFC; color: var(--muted); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; position: sticky; top: 0; }
.files { max-height: 380px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
dialog { border: none; border-radius: 16px; padding: 22px; min-width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(11,26,51,.45); }
#toast { position: fixed; bottom: 18px; inset-inline-start: 18px; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 10px; max-width: 70vw; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
#toast.err { background: var(--bad); }
.lbrand { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.lbrand img { max-height: 42px; max-width: 120px; border-radius: 10px; } .lbrand .mark { width: 42px; height: 42px; border-radius: 12px; background: var(--ai); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.lbrand b { display: block; font-size: 17px; font-weight: 800; } .lbrand small { color: var(--muted); font-size: 13px; }
.time { display: inline-flex; gap: 6px; align-items: center; } .time select { width: auto; min-width: 74px; font-variant-numeric: tabular-nums; }   /* HH : MM, chosen — never typed */
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 0 18px 16px; }
/* SRC-030: the folder tree — ✓ back up with everything inside, ✕ skip a folder inside a chosen one */
.pick2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; max-width: 900px; }
@media (max-width: 760px) { .pick2 { grid-template-columns: minmax(0, 1fr); } }
.ftree { border: 1px solid var(--line); border-radius: 10px; padding: 6px; max-height: 380px; overflow: auto; }
.tkids { padding-inline-start: 20px; }
.trow, .srow { display: flex; align-items: center; gap: 6px; min-height: 30px; }
.ttw { border: 0; background: none; cursor: pointer; width: 22px; color: var(--muted); font-size: 12px; padding: 0; }
.tcb { width: 22px; height: 22px; flex: 0 0 22px; border: 1.5px solid #CBD5E1; border-radius: 5px; background: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; color: #fff; }
.tcb.on, .tcb.onpart { background: var(--ok); border-color: var(--ok); } .tcb.part { color: var(--ok); border-color: var(--ok); } .tcb.exc { background: var(--bad); border-color: var(--bad); }
.tname { overflow-wrap: break-word; min-width: 0; } .tname.exc { text-decoration: line-through; color: var(--muted); } .tname.on, .tname.onpart { font-weight: 600; }
.sgroup { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; margin-bottom: 6px; }
.srow.sub { padding-inline-start: 22px; color: var(--muted); } .srow .grow { flex: 1; min-width: 0; overflow-wrap: break-word; }
.srow button, .pickadd button { padding: 4px 10px; }
.pickadd { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; } .pickadd input { flex: 1; min-width: 160px; }
@media (max-width: 600px) { main { margin: 10px 6px 96px; } }
</style>
</head>
<body>
<div class="frame">
<aside><header><img id="logo" alt="" hidden><span class="p"><span id="product">Backup</span><small id="slogan"></small></span></header><nav id="nav"></nav></aside>
<div class="page"><main id="main"><p class="muted">…</p></main><footer id="foot"></footer><div id="rbar" class="rbar" hidden></div></div>
</div>
<div id="toast" hidden></div>
<script src="/i18n/i18n.js"></script>
<script src="/i18n/qrcode.js"></script>
<script>
(async function () {
  'use strict';
  await I18N.load(I18N.pick(document.documentElement.getAttribute('data-lang')));   // I18N-010
  let KEY = location.hash.slice(1); try { if (KEY) sessionStorage.setItem('k', KEY); else KEY = sessionStorage.getItem('k') || ''; } catch (e) { } history.replaceState(null, '', '/');
  const $ = (s) => document.querySelector(s);
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else e.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : String(k));
    return e;
  }
  function toXml(obj) {
    const doc = document.implementation.createDocument(null, 'm', null);
    const build = (o, el) => { for (const [k, v] of Object.entries(o)) {
      if (Array.isArray(v)) { const l = doc.createElement('l'); l.setAttribute('n', k); for (const it of v) { const i = doc.createElement('i'); build(it, i); l.append(i); } el.append(l); }
      else if (v !== undefined && v !== null) { const f = doc.createElement('f'); f.setAttribute('n', k); f.textContent = String(v); el.append(f); } } };
    build(obj, doc.documentElement); return new XMLSerializer().serializeToString(doc);
  }
  function fromXml(el) { const o = {}; for (const c of el.children) { if (c.tagName === 'f') o[c.getAttribute('n')] = c.textContent; else if (c.tagName === 'l') o[c.getAttribute('n')] = Array.from(c.children).map(fromXml); } return o; }
  const list = (v) => Array.isArray(v) ? v : [];
  const put = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((k) => k !== null && k !== undefined && k !== false));
  async function api(op, body, query) {
    const r = await fetch('/api/' + op + (query ? '?' + new URLSearchParams(query) : ''), { method: body ? 'POST' : 'GET', headers: { 'X-Key': KEY, 'Content-Type': 'application/xml' }, body: body ? toXml(body) : undefined });
    const t = await r.text(); const m = t ? fromXml(new DOMParser().parseFromString(t, 'application/xml').documentElement) : {};
    if (r.status === 401) { const ok = await loginDialog(); if (ok) return api(op, body, query); throw new Error(t('Sign-in required')); }
    if (!r.ok) throw new Error(tr(m.message) || t('Error {0}', r.status));
    return m;
  }
  function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, err ? 7000 : 3500); }
  const wrap = (fn) => async (e) => { try { await fn(e); } catch (x) { toast(x.message, true); } };
  const size = (b) => { b = Number(b || 0); const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return (i ? b.toFixed(1) : b) + ' ' + u[i]; };
  function when(v) {
    if (!v) return t('Not yet');
    let d = /^\d{4}-\d\d-\d\d-\d\d-\d\d-\d\d$/.test(v) ? new Date(v.replace(/^(\d{4}-\d\d-\d\d)-(\d\d)-(\d\d)-(\d\d)$/, '$1T$2:$3:$4Z')) : new Date(v);
    return isNaN(d) ? v : d.toLocaleString(I18N.lang, { dateStyle: 'short', timeStyle: 'short' });
  }

  function loginDialog() {
    return new Promise((done) => {
      const pw = h('input', { type: 'password', autocomplete: 'current-password' }), otp = h('input', { inputmode: 'numeric', autocomplete: 'one-time-code' });
      const d = h('dialog', {}, h('div', { class: 'lbrand' }, ST && ST.logo === '1' ? h('img', { src: '/logo', alt: '' }) : h('span', { class: 'mark' }, '✦'), h('div', {}, h('b', {}, (ST && ST.product) || ''), ST && ST.slogan ? h('small', {}, ST.slogan) : null)), h('h3', {}, t('Sign in')), h('p', { class: 'muted' }, t('Restoring and adding backups require your password.')),
        h('label', {}, t('Password')), pw, h('label', {}, t('Verification code (if enabled)')), otp,
        h('div', { class: 'bar' }, h('button', { class: 'primary', onclick: wrap(async () => {
          const r = await fetch('/api/login', { method: 'POST', headers: { 'X-Key': KEY }, body: toXml({ password: pw.value, otp: otp.value }) });
          if (!r.ok) { const m = fromXml(new DOMParser().parseFromString(await r.text(), 'application/xml').documentElement); throw new Error(tr(m.message) || t('Sign-in failed')); }
          d.close(); d.remove(); done(true); }) }, t('Sign in')),
        h('button', { class: 'sec', onclick: () => { d.close(); d.remove(); done(false); } }, t('Cancel'))));
      document.body.append(d); d.showModal(); pw.focus();
    });
  }

  // ---- alternative C ("Hybrid", owner 08.10.2026) — the same rules as the native window (src/Agent/ClientView.cs)
  let ST = null, PAGE = 'home', JOBS = [];
  const PAGES = [['home', t('Home'), '⌂'], ['sets', t('Backups'), '☰'], ['restore', t('Restore'), '↺'], ['history', t('History'), '◷'], ['settings', t('Settings'), '⚙']];
  const company = () => ST.company || t('your IT provider');
  const LOCKED = t('This setting is managed by your service provider');   // owner Q5
  const RESTORE_KEEPS = t('Restored: the content and the modified time. Not restored: permissions and file attributes.');   // B5
  const showsUpdate = () => ST.pilot !== '1';   // owner Q3 (the web window has no update button at all)
  async function load() {
    ST = await api('state');
    document.title = ST.product; $('#product').textContent = ST.product; $('#slogan').textContent = ST.slogan || ST.company || '';
    // owner Q6: white-label = the logo and the names only (no brand colours)
    if (ST.logo === '1') { $('#logo').src = '/logo'; $('#logo').hidden = false; }
    $('#foot').textContent = [ST.website, ST.powered && t('Powered by {0}', ST.powered)].filter(Boolean).join(' · ');
    show(PAGE);
  }
  function nav() {
    const cur = PAGE === 'add' || PAGE === 'edit' ? 'sets' : PAGE;
    const problems = homeView().problems.length;
    put($('#nav'), ...PAGES.map(([k, label, g]) => h('button', { class: k === cur ? 'on' : '', onclick: () => { if (k === 'restore') R.step = 1; show(k); } }, h('span', { class: 'g' }, g), h('span', { class: 'l' }, label), k === 'sets' && problems ? h('span', { class: 'warn' }, ' ⚠') : null)),
      h('div', { class: 'navfoot' }, h('div', { class: 'pc' }, h('b', { class: 'ltr' }, ST.computer || ''), h('small', { class: ST.offline ? 'bad' : 'ok' }, '● ' + (ST.offline ? t('No connection') : t('Connected')))),
        h('button', { id: 'navHelp', class: PAGE === 'help' ? 'on' : '', onclick: () => show('help') }, h('span', { class: 'g' }, '?'), h('span', { class: 'l' }, t('Help from {0}', company())))));
  }
  function show(p) {
    PAGE = p; nav();
    const m = $('#main'); put(m, h('p', { class: 'muted' }, t('Loading…'))); put($('#rbar'));
    $('#rbar').hidden = p !== 'restore';
    ({ home, sets, restore, history, settings, add, edit, help })[p](m).catch((x) => put(m, h('p', { class: 'bad' }, x.message)));
  }

  // ---- one result (owner decision B2: a run with files not backed up is Partial, amber; never "completed")
  const KIND = (r) => !r ? 'never' : r === 'BS_STOP_SUCCESS' ? 'complete' : r === 'BS_STOP_SUCCESS_WITH_WARNING' ? 'warnings' : r.startsWith('BS_STOP_SUCCESS') ? 'partial' : r === 'BS_STOP_BY_USER' ? 'stopped' : 'failed';
  const TONE = { complete: 'ok', warnings: 'ok', partial: 'warn', failed: 'bad', stopped: 'muted', never: 'muted', running: 'info', blocked: 'muted' };
  const ICON = { ok: '✓', warn: '!', bad: '✕', muted: '–', info: '↻' };
  const RESULT = { BS_STOP_SUCCESS: [t('Complete'), 'ok'], BS_STOP_SUCCESS_WITH_WARNING: [t('Complete — with warnings'), 'ok'], BS_STOP_SUCCESS_WITH_ERROR: [t('Partial'), 'warn'], BS_STOP_BY_USER: [t('Stopped'), 'muted'], BS_STOP_QUOTA_EXCEEDED: [t('Failed — the quota is full'), 'bad'] };
  const word = (k, r) => k === 'running' ? t('Running') : k === 'blocked' ? t('Does not run in the pilot') : k === 'never' ? t('Not backed up yet') : (RESULT[r] || [t('Failed')])[0];
