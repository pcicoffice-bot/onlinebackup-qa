<!doctype html>
<html lang="en" dir="ltr" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup</title>
<link rel="stylesheet" href="/i18n/theme.css">
<style>
.qrbox { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 8px 0 12px; } img.qr { background: #fff; border: 1px solid var(--line); border-radius: 8px; }

h1, h2, h3, p, label, li, td, th, .muted { overflow-wrap: break-word; }
/* colours, fonts, the top bar and the AI signature: /i18n/theme.css (DESIGN-040) */
* { box-sizing: border-box; }
body { font-size: 15px; line-height: 1.55; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 22px; }
header img { height: 36px; background: #fff; border-radius: 8px; padding: 3px; }

nav button.on { color: #fff; background: var(--ink2); box-shadow: 0 4px 12px rgba(11,16,32,.18); }
main { background: #fff; margin: 14px 22px 22px; border: 1px solid var(--line); border-radius: 20px; padding: 22px; min-height: 360px; box-shadow: var(--shadow); }
.hero { position: relative; overflow: hidden; display: flex; gap: 18px; align-items: center; border-radius: 18px; padding: 22px 24px; margin-bottom: 18px; color: #fff; background: #047857; background: radial-gradient(400px 160px at 90% 0%, rgba(255,255,255,.22), transparent 70%), linear-gradient(120deg, #065F46, #10B981); box-shadow: 0 14px 34px rgba(5,150,105,.28); }
.hero .ai-watch { margin-inline-start: auto; font-size: 13px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.hero.h-attn, .hero.h-bad { box-shadow: none; }
.hero.h-attn { background: var(--warn); background: linear-gradient(120deg, #B45309, #F59E0B); }
.hero.h-bad { background: var(--bad); background: linear-gradient(120deg, #B91C1C, #EF4444); }
.hero .ico { flex: none; width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 26px; }
.hero b { font-size: 20px; display: block; } .hero span { opacity: .9; font-size: 14px; }
.card { border: 1px solid var(--line); border-inline-start: 4px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #fff; }
.card.st-ok { border-inline-start-color: var(--ok); } .card.st-warn { border-inline-start-color: var(--warn); } .card.st-bad { border-inline-start-color: var(--bad); }
.card .n { font-weight: 700; font-size: 16px; }
.card .s { color: var(--muted); font-size: 13px; }
.grow { flex: 1; min-width: 200px; }
button.primary { padding: 9px 18px; font: inherit; font-weight: 650; cursor: pointer; }
button.sec { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; color: var(--text); }
button.sec:hover { border-color: #CBD5E1; }
button:disabled { opacity: .5; cursor: default; }
.ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; } .warn { color: var(--warn); font-weight: 600; } .muted { color: var(--muted); }
label { display: block; margin: 12px 0 5px; font-weight: 600; font-size: 14px; }
input, select, textarea { font: inherit; padding: 8px 11px; border: 1px solid #CBD5E1; border-radius: 9px; width: 100%; max-width: 540px; background: #fff; color: var(--text); }
input[type=checkbox] { accent-color: var(--brand); }
textarea { min-height: 90px; }
.ltr { direction: ltr; unicode-bidi: isolate; text-align: left; }   /* ltr-ok: Latin addresses and paths */
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: start; }
th { background: #F8FAFC; color: var(--muted); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; position: sticky; top: 0; }
.files { max-height: 380px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
dialog { border: none; border-radius: 16px; padding: 22px; min-width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(11,26,51,.45); }
#toast { position: fixed; bottom: 18px; inset-inline-start: 18px; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 10px; max-width: 70vw; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
#toast.err { background: var(--bad); }
.lbrand { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.lbrand img { max-height: 42px; max-width: 120px; border-radius: 10px; } .lbrand .mark { width: 42px; height: 42px; border-radius: 12px; background: var(--ai); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.lbrand b { display: block; font-size: 17px; font-weight: 800; } .lbrand small { color: var(--muted); font-size: 13px; }
.time { display: inline-flex; gap: 6px; align-items: center; } .time select { width: auto; min-width: 74px; font-variant-numeric: tabular-nums; }   /* HH : MM, chosen — never typed */
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 0 18px 16px; }
/* SRC-030: the folder tree — ✓ back up with everything inside, ✕ skip a folder inside a chosen one */
.pick2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; max-width: 900px; }
@media (max-width: 760px) { .pick2 { grid-template-columns: minmax(0, 1fr); } }
.ftree { border: 1px solid var(--line); border-radius: 10px; padding: 6px; max-height: 380px; overflow: auto; }
.tkids { padding-inline-start: 20px; }
.trow, .srow { display: flex; align-items: center; gap: 6px; min-height: 30px; }
.ttw { border: 0; background: none; cursor: pointer; width: 22px; color: var(--muted); font-size: 12px; padding: 0; }
.tcb { width: 22px; height: 22px; flex: 0 0 22px; border: 1.5px solid #CBD5E1; border-radius: 5px; background: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; color: #fff; }
.tcb.on, .tcb.onpart { background: var(--ok); border-color: var(--ok); } .tcb.part { color: var(--ok); border-color: var(--ok); } .tcb.exc { background: var(--bad); border-color: var(--bad); }
.tname { overflow-wrap: break-word; min-width: 0; } .tname.exc { text-decoration: line-through; color: var(--muted); } .tname.on, .tname.onpart { font-weight: 600; }
.sgroup { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; margin-bottom: 6px; }
.srow.sub { padding-inline-start: 22px; color: var(--muted); } .srow .grow { flex: 1; min-width: 0; overflow-wrap: break-word; }
.srow button, .pickadd button { padding: 4px 10px; }
.pickadd { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; } .pickadd input { flex: 1; min-width: 160px; }
@media (max-width: 600px) { main { margin: 10px 6px; padding: 12px; } nav { margin: 10px 6px 0; max-width: calc(100% - 12px); } .hero { flex-wrap: wrap; } .hero .ai-watch { margin-inline-start: 0; white-space: normal; } header .c { display: none; } .hero { padding: 14px; } .hero b { font-size: 17px; } }
</style>
</head>
<body>

<main id="main"><p class="muted">…</p></main>

<div id="toast" hidden></div>
<script src="/i18n/i18n.js"></script>

  // ---- status / backup now ----
  async function home(m) {

      h('label', {}, t('Restore to folder')), target, h('label', {}, h('span', {}, overwrite, t(' Replace existing files'))), m365Row,
